name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The "Publish site" commit is produced by this workflow. Building it again
    # would loop, and those generated files are not valid build input.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Publish site') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove the previously published page
        run: |
          rm -f index.html 404.html
          rm -rf assets
      - run: npm ci
      - run: npm run build:pages
      - name: Static fallback
        run: |
          test -f .vercel/output/static/index.html
          cp .vercel/output/static/index.html .vercel/output/static/404.html
          touch .vercel/output/static/.nojekyll
      - name: Publish onto main for branch Pages
        run: |
          cp .vercel/output/static/index.html index.html
          cp .vercel/output/static/index.html 404.html
          cp .vercel/output/static/favicon.svg favicon.svg
          cp .vercel/output/static/og.jpg og.jpg
          touch .nojekyll
          rm -rf assets __grok
          cp -a .vercel/output/static/assets assets
          cp -a .vercel/output/static/__grok __grok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll favicon.svg og.jpg assets __grok
          if git diff --cached --quiet; then
            echo "Site files unchanged"
          else
            git commit -m "Publish site"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static
      - id: deployment
        uses: actions/deploy-pages@v4
